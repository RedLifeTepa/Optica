    // ============================================================================
    // 2. UTILIDADES DE FORMATO MEXICANO (MXN, America/Mexico_City, RFC)
    // ============================================================================
    const MX_FMT = {
      currency(val) {
        const num = Number(val) || 0;
        return new Intl.NumberFormat('es-MX', {
          style: 'currency',
          currency: 'MXN',
          minimumFractionDigits: 2
        }).format(num);
      },
      date(dateStr) {
        if (!dateStr) return '—';
        try {
          const d = new Date(dateStr.includes('T') ? dateStr : dateStr + 'T12:00:00');
          return new Intl.DateTimeFormat('es-MX', {
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            timeZone: 'America/Mexico_City'
          }).format(d);
        } catch (e) {
          return dateStr;
        }
      },
      dateTime(dateStr) {
        if (!dateStr) return '—';
        try {
          const d = new Date(dateStr);
          return new Intl.DateTimeFormat('es-MX', {
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            timeZone: 'America/Mexico_City'
          }).format(d);
        } catch (e) {
          return dateStr;
        }
      },
      diopter(val) {
        if (val === '' || val === null || val === undefined) return '—';
        const n = parseFloat(val);
        if (isNaN(n)) return String(val);
        if (n === 0) return '0.00 (Neutro)';
        return (n > 0 ? '+' : '') + n.toFixed(2);
      },
      escape(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
    };

    // Generar opciones de esfera desde -20.00 hasta +20.00 en pasos de 0.25
    const SPHERE_OPTIONS = [];
    for (let v = -20.0; v <= 20.001; v += 0.25) {
      const fixed = (v > 0 ? '+' : '') + v.toFixed(2);
      SPHERE_OPTIONS.push(fixed);
    }
    const CYLINDER_OPTIONS = [];
    for (let v = -10.0; v <= 6.001; v += 0.25) {

    function loadDatabase() {
      try {
        const raw = localStorage.getItem(DB_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.customers && parsed.orders) {
            return parsed;
          }
        }
      } catch (e) {
        console.warn('Fallback a memoria en sandbox:', e);
      }
      const seed = getInitialSeedDatabase();
      saveDatabase(seed);
      return seed;
    }

    function saveDatabase(customDb = null) {
      const target = customDb || DB;
      try {
        localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(target));
      } catch (e) {
        // Ignorar si quota o sandbox restringe
      }
      // También persistir en IndexedDB asíncronamente para arquitectura PWA real
      try {
        if (window.indexedDB) {
          const req = indexedDB.open('OpticaDensIndexedDB', 1);
          req.onupgradeneeded = function(ev) {
            const idb = ev.target.result;
            if (!idb.objectStoreNames.contains('state')) {
              idb.createObjectStore('state', { keyPath: 'id' });
            }
          };
          req.onsuccess = function(ev) {
            const idb = ev.target.result;
            const tx = idb.transaction('state', 'readwrite');
            tx.objectStore('state').put({ id: 'main', updatedAt: new Date().toISOString(), payload: target });
          };
        }
      } catch (e) {}
    }

    function handlePwaAction(action) {
      const rec = getPwaIpRecord();
      const now = new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16);
      rec.lastSeen = now;
      if (action === 'install') {
        if (deferredPwaPrompt) {
          deferredPwaPrompt.prompt();
        }
        rec.installed = true;
        rec.history.push({ attempt: rec.impressions, date: now, action: 'Instaló la aplicación PWA' });
        saveDatabase();
        logAudit('Instalación PWA', rec.ip, 'Dispositivo instaló la PWA Óptica Dens.');
        showToast('Óptica Dens instalada como PWA', 'El acceso directo y el Service Worker de alertas están activos en este dispositivo.', 'success');
      } else if (action === 'later') {
        APP_STATE.pwaDismissedThisSession = true;
        if (rec.impressions >= 3) {
          rec.rejectedPermanently = true;
          rec.history.push({ attempt: rec.impressions, date: now, action: 'Alcanzó límite de 3 apariciones por IP (No volverá a mostrarse)' });
        } else {
          rec.history.push({ attempt: rec.impressions, date: now, action: `Posponer ("Ahora no") — Aparición ${rec.impressions}/3` });
        }
        saveDatabase();
      } else if (action === 'never') {
        rec.rejectedPermanently = true;
        rec.impressions = 3;
        rec.history.push({ attempt: rec.impressions, date: now, action: 'Rechazó permanentemente ("No volver a mostrar")' });
        saveDatabase();
        showToast('Preferencia guardada para IP ' + rec.ip, 'El banner de instalación PWA no volverá a mostrarse para esta IP.', 'info');
      }
      renderPwaFloatingBanner();
      if (APP_STATE.activeModule === 'settings') renderApp();
    }

    function triggerNextSimulatedPwaImpression() {
      const rec = getPwaIpRecord();
      APP_STATE.pwaDismissedThisSession = false;
      if (rec.impressions >= 3) {
        showToast('Límite de 3 apariciones alcanzado', `La IP ${rec.ip} ya registró 3 apariciones. Por regla obligatoria no se muestra una 4ª vez a menos que reinicies el contador.`, 'warn');
        renderPwaFloatingBanner();
        renderApp();
        return;
      }
      rec.impressions += 1;
      const now = new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16);
      rec.lastSeen = now;
      rec.history.push({ attempt: rec.impressions, date: now, action: `Simulación de visita #${rec.impressions} desde IP ${rec.ip}` });
      saveDatabase();
      renderPwaFloatingBanner();
      renderApp();
      showToast(`Visita #${rec.impressions}/3 registrada`, `El banner flotante está visible (Aparición ${rec.impressions} de 3 para la IP ${rec.ip}).`, 'info');
    }

    function resetPwaCounterForTesting() {
      const rec = getPwaIpRecord();
      rec.impressions = 1;
      rec.installed = false;
      rec.rejectedPermanently = false;
      APP_STATE.pwaDismissedThisSession = false;
      const now = new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16);
      rec.history.push({ attempt: 1, date: now, action: 'Contador reiniciado por Administrador para pruebas (1/3)' });
      saveDatabase();
      logAudit('Reinicio contador PWA', rec.ip, 'Administrador reinició el contador de apariciones por IP para pruebas.');
      renderPwaFloatingBanner();
      renderApp();
      showToast('Contador PWA reiniciado', `La IP ${rec.ip} vuelve a estar en 1/3 apariciones y el banner está activo.`, 'success');
    }

    // Inicializar manifest dinámico + Service Worker seguro en navegador
    function setupPwaManifestAndServiceWorker() {
      try {
        const manifestObj = {
          name: "Óptica Dens — Sistema Integral Óptico",
          short_name: "Óptica Dens",
          description: "Sistema clínico, punto de venta, laboratorio, inventario y facturación CFDI 4.0 para Óptica Dens.",
          start_url: "./",
          display: "standalone",
          background_color: "#F4F7FA",
          theme_color: "#0070B8",
          lang: "es-MX",
          icons: [
            { src: OPTICA_LOGO_SRC, sizes: "192x192", type: "image/jpeg" },
            { src: OPTICA_LOGO_SRC, sizes: "512x512", type: "image/jpeg" }
          ]
        };
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
      } catch (e) {}
    }

    // ============================================================================
    // 8. MOTOR DE NOTIFICACIONES PUSH / EN VENTANA
    // ============================================================================
    function dispatchSystemNotification(type, message, targetScope = 'Este dispositivo') {
      const cfg = DB.notificationsConfig;
      const rule = cfg.rulesByType[type] || { enabled: true, channel: 'Ambos (Ventana + Push)', frequency: 'Inmediata' };
      const now = new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16);

      if (cfg.globalMode === 'OFF') {
        cfg.history.unshift({
          id: 'NTF-' + Math.floor(1000 + Math.random() * 9000),
          date: now,
          type,
          target: targetScope,
          device: 'Bloqueado (Modo global Apagado)',
          status: 'Omitida (Notificaciones apagadas)',
          message
        });
        saveDatabase();
        showToast('Notificaciones globales apagadas', 'Se registró en historial pero no se emitió alerta push porque el modo global está en Apagado.', 'warn');
        return;
      }

      if (!rule.enabled) {
        cfg.history.unshift({
          id: 'NTF-' + Math.floor(1000 + Math.random() * 9000),
          date: now,
          type,
          target: targetScope,
          device: 'Filtro por tipo de alerta',
          status: 'Silenciada por regla de categoría',
          message
        });
        saveDatabase();
        showToast(`Alerta "${type}" silenciada`, 'Esta categoría está desactivada en tus preferencias de notificaciones.', 'info');
        return;
      }

      // Registrar en historial
      cfg.history.unshift({
        id: 'NTF-' + Math.floor(1000 + Math.random() * 9000),
        date: now,
        type,
        target: targetScope,
        device: targetScope === 'Este dispositivo' ? 'Navegador actual (FCM Web Push)' : targetScope,
        status: 'Entregada',
        message
      });
      saveDatabase();

      // Mostrar en ventana del sistema
      showToast(`[${type}] — ${targetScope}`, message, 'info');

      // Si el navegador soporta Notification API y tiene permiso, disparar Web Notification nativa
      try {
        if ('Notification' in window && Notification.permission === 'granted' && (cfg.globalMode === 'PUSH_ENABLED' || cfg.globalMode === 'ALL_ENABLED')) {
          new Notification(`Óptica Dens: ${type}`, { body: message, icon: OPTICA_LOGO_SRC });
        }
      } catch (e) {}
    }

    function switchUserRole(userId) {
      APP_STATE.currentUserId = userId;
      const user = getCurrentUser();
      const allowed = ROLE_MODULES[user.role].map(m => m.id);
      if (!allowed.includes(APP_STATE.activeModule)) {
        APP_STATE.activeModule = 'dashboard';
      }
      // Si es Recepción, activar automáticamente diseño simplificado si la pantalla es pequeña
      logAudit('Cambio de sesión / rol', user.name, `Sesión activa como ${user.roleLabel}`);
      showToast(`Sesión activa: ${user.name}`, `Interfaz adaptada al rol: ${user.roleLabel}`, 'success');
      renderApp();
      renderPwaFloatingBanner();
    }

    function navigateTo(moduleId, extraParams = {}) {
      const user = getCurrentUser();
      const allowed = ROLE_MODULES[user.role].map(m => m.id);
      if (!allowed.includes(moduleId)) {
        showToast('Acceso restringido por rol', `El rol ${user.roleLabel} no tiene permiso para abrir el módulo solicitado.`, 'danger');
        return;
      }
      if (extraParams.customerId) {
        APP_STATE.selectedCustomerId = extraParams.customerId;
      }
      if (extraParams.expedienteTab) {
        APP_STATE.activeExpedienteTab = extraParams.expedienteTab;
      }
      APP_STATE.activeModule = moduleId;
      renderApp();
      renderPwaFloatingBanner();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filterCustomersList(query) {
      const q = (query || '').trim().toLowerCase();
      if (!q) return DB.customers;
      return DB.customers.filter(c => {
        const full = [
          c.firstName,
          c.lastName,
          c.phone,
          c.whatsapp,
          c.email,
          c.fiscal?.rfc,
          c.internalCode,
          c.customerCode,
          c.barcode,
          c.city,
          c.contactNotes
        ].join(' ').toLowerCase();
        return full.includes(q);
      });
    }

    function saveNewCustomer(form) {
      const fd = new FormData(form);
      const nextNum = 1001 + DB.customers.length;
      const newCust = {
        id: 'CLI-' + nextNum,
        branchId: DB.meta.activeBranchId,
        internalCode: 'OD-00' + (101 + DB.customers.length),
        customerCode: 'CLI-' + nextNum,
        barcode: '7509988' + Math.floor(10000 + Math.random() * 89999),
        firstName: fd.get('firstName') || 'Nuevo',
        lastName: fd.get('lastName') || 'Cliente',
        birthDate: fd.get('birthDate') || '1990-01-01',
        sex: fd.get('sex') || 'No especificado',
        phone: fd.get('phone') || '378 000 0000',
        whatsapp: fd.get('whatsapp') || ('52' + String(fd.get('phone') || '').replace(/\D/g, '')),
        email: fd.get('email') || 'sin-correo@opticadens.mx',
        address: fd.get('address') || 'Domicilio conocido',
        city: fd.get('city') || 'Tepatitlán de Morelos, Jal.',
        contactNotes: fd.get('contactNotes') || '',
        altContact: fd.get('contactNotes') || 'No registrado',
        createdAt: '2026-10-15',
        lastVisit: '2026-10-15',
        nextRecommendedVisit: '2027-10-15',
        contactPreference: fd.get('whatsappConsent') ? 'WhatsApp' : 'Teléfono',
        whatsappConsent: Boolean(fd.get('whatsappConsent')),
        whatsappConsentDate: fd.get('whatsappConsent') ? '2026-10-15 12:50' : null,
        whatsappRemindersEnabled: Boolean(fd.get('whatsappConsent')),
        fiscal: {
          rfc: (fd.get('rfc') || 'XAXX010101000').toUpperCase(),
          legalName: ((fd.get('firstName') || '') + ' ' + (fd.get('lastName') || '')).toUpperCase(),
          postalCode: fd.get('postalCode') || '47600',
          taxRegime: '616 - Sin obligaciones fiscales',
          cfdiUse: 'S01 - Sin efectos fiscales',
          fiscalEmail: fd.get('email') || '',
          history: []
        },
        alerts: [],
        internalNotes: []
      };
      DB.customers.unshift(newCust);
      APP_STATE.selectedCustomerId = newCust.id;
      saveDatabase();
      logAudit('Alta de cliente', newCust.id, `Se creó el expediente de ${newCust.firstName} ${newCust.lastName}`);

      navigateTo('expediente', { customerId: newCust.id, expedienteTab: 'resumen' });
      showToast('Cliente registrado con éxito', `${newCust.firstName} ${newCust.lastName} (${newCust.internalCode}) ya tiene su expediente listo.`, 'success');
    }

            <span class="text-[10px] uppercase tracking-wider font-semibold text-slate-400 block">7. Último estudio</span>

          </div>
          <div class="dens-card p-3 bg-amber-50/60 border-amber-200">
            <span class="text-[10px] uppercase tracking-wider font-semibold text-amber-700 block">8. Alertas</span>
            <p class="text-xs font-bold text-amber-900 mt-1">${c.alerts.length} activa(s)</p>
            <span class="text-[10px] text-amber-800 truncate block">${c.alerts[0] ? MX_FMT.escape(c.alerts[0].text) : 'Sin alertas'}</span>
          </div>
        </div>

        <!-- Barra de las 13 Pestañas del Expediente -->
        <div class="dens-card p-2 mb-5 overflow-x-auto custom-scroll">
          <div class="flex items-center gap-1 min-w-max">
            ${allTabs.map(t => {
              if (t.onlyAiRoles && !canAccessAI(user)) {
                return `
                  <button type="button" disabled title="Exclusivo para Optometrista y Administrador autorizado" class="px-3 py-2 rounded-xl text-xs font-semibold text-slate-400 bg-slate-50 cursor-not-allowed flex items-center gap-1">
                    <i data-lucide="lock" class="w-3 h-3"></i> ${t.label}
                  </button>
                `;
              }
              const active = APP_STATE.activeExpedienteTab === t.id;
              return `
                <button type="button"
                  onclick="APP_STATE.activeExpedienteTab = '${t.id}'; renderApp();"
                  class="px-3 py-2 rounded-xl text-xs font-semibold transition ${

                  }">

        <!-- Contenido dinámico de la pestaña seleccionada -->
        <div>
          ${renderExpedienteTabContent(c, user, {
            custConsultations,
            custPrescriptions,
            custOrders,
            custSales,
            custPayments,
            custInvoices,
            custAppointments,
            custFiles
          })}
        </div>
      `;
    }

    function buildCustomerChronologicalTimeline(c, data) {
      const events = [];
      data.custAppointments.forEach(a => {
        events.push({ date: a.date + ' ' + a.time, type: 'Cita', badge: 'bg-densBlue-100 text-densBlue-800', title: `Cita: ${a.type} (${a.status})`, desc: a.notes || 'Agendada con ' + a.doctor });
      });
      data.custConsultations.forEach(con => {
        events.push({ date: con.date + ' ' + con.time, type: 'Consulta', badge: 'bg-purple-100 text-purple-800', title: `Consulta Optométrica (${con.id}) — ${con.optometrist}`, desc: con.reason });
      });
      data.custPrescriptions.forEach(rx => {
        events.push({ date: rx.date + ' 13:00', type: 'Fórmula', badge: 'bg-densLime-100 text-densLime-800', title: `Fórmula ${rx.id} (${rx.signed ? 'Firmada v' + rx.version : 'En borrador'})`, desc: `OD: ${rx.od.sphere} ${rx.od.cylinder}x${rx.od.axis}° | OI: ${rx.oi.sphere} ${rx.oi.cylinder}x${rx.oi.axis}° • ${rx.lensType}` });
      });
      data.custFiles.forEach(f => {
        events.push({ date: f.uploadedAt, type: 'Estudio / Archivo', badge: 'bg-sky-100 text-sky-800', title: `${f.category}: ${f.name}`, desc: f.description });
      });
      data.custOrders.forEach(o => {
        events.push({ date: o.createdAt + ' 14:00', type: 'Pedido', badge: 'bg-amber-100 text-amber-800', title: `Pedido ${o.id} — Estado: ${o.status}`, desc: o.items.map(i => i.name).join(' + ') });
        (o.history || []).forEach(h => {
          events.push({ date: h.date, type: 'Cambio de estado', badge: 'bg-slate-200 text-slate-800', title: `Pedido ${o.id} → ${h.status}`, desc: `${h.note} (${h.user})` });
        });
      });
      data.custPayments.forEach(p => {
        events.push({ date: p.date, type: 'Abono / Pago', badge: 'bg-emerald-100 text-emerald-800', title: `${p.type}: ${MX_FMT.currency(p.amount)} (${p.method})`, desc: `${p.notes} • Registró: ${p.user}` });
      });
      data.custInvoices.forEach(inv => {
        events.push({ date: inv.date, type: 'Factura', badge: 'bg-indigo-100 text-indigo-800', title: `Factura CFDI 4.0 ${inv.serieFolio} (${MX_FMT.currency(inv.total)})`, desc: `UUID: ${inv.uuid} • Uso: ${inv.cfdiUse}` });
      });
      (c.internalNotes || []).forEach(n => {
        events.push({ date: n.date, type: 'Nota', badge: 'bg-rose-100 text-rose-800', title: `Nota de ${n.author}`, desc: n.text });
      });
      return events.sort((a, b) => (b.date > a.date ? 1 : -1));
    }

    function renderExpedienteTabContent(c, user, data) {
      const tab = APP_STATE.activeExpedienteTab;

      // PESTAÑA 1: RESUMEN Y LÍNEA DE TIEMPO CRONOLÓGICA
      if (tab === 'resumen') {
        const timeline = buildCustomerChronologicalTimeline(c, data);
        return `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <div class="lg:col-span-2 dens-card p-5">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2">

              </div>
              <div class="relative pl-6 border-l-2 border-densBlue-200 space-y-4">
                ${timeline.map(ev => `
                  <div class="relative bg-slate-50/80 border border-slate-200/80 rounded-xl p-3">

                    </div>
                    <p class="text-xs font-bold text-slate-900 mt-1">${MX_FMT.escape(ev.title)}</p>

                  <p><strong>Correo:</strong> ${MX_FMT.escape(c.email)}</p>
                  <p><strong>Domicilio:</strong> ${MX_FMT.escape(c.address)}, ${MX_FMT.escape(c.city)}</p>
                  <p><strong>Contacto alt.:</strong> ${MX_FMT.escape(c.altContact)}</p>
                  <p><strong>Preferencia:</strong> ${MX_FMT.escape(c.contactPreference)} (${c.whatsappConsent ? 'Autorizado el ' + c.whatsappConsentDate : 'Sin autorización WA'})</p>
                </div>
              </div>
            </div>
          </div>

      // PESTAÑA 2: DATOS PERSONALES Y FISCALES (Sección 3.A y 3.B)
      if (tab === 'datos') {
        return `

              </div>
            </div>

            <div class="dens-card p-5 space-y-3">

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="font-semibold text-slate-600 block mb-1">RFC</label>

                <div>
                  <label class="font-semibold text-slate-600 block mb-1">Código Postal Fiscal</label>

                <div class="sm:col-span-2">
                  <label class="font-semibold text-slate-600 block mb-1">Nombre o Razón Social Fiscal (Tal como aparece en Constancia SAT)</label>

                <div class="sm:col-span-2">

    function updateCustomerPersonalAndFiscal(customerId, form) {
      const c = DB.customers.find(x => x.id === customerId);
      if (!c) return;
      const fd = new FormData(form);
      const newRfc = (fd.get('rfc') || '').toUpperCase();
      if (c.fiscal && c.fiscal.rfc && c.fiscal.rfc !== newRfc) {
        c.fiscal.history.unshift({
          date: '2026-10-15',
          rfc: c.fiscal.rfc,
          postalCode: c.fiscal.postalCode,
          taxRegime: c.fiscal.taxRegime,
          note: 'Respaldo automático antes de cambio fiscal'
        });
      }
      c.firstName = fd.get('firstName') || c.firstName;
      c.lastName = fd.get('lastName') || c.lastName;
      c.birthDate = fd.get('birthDate') || c.birthDate;
      c.sex = fd.get('sex') || c.sex;
      c.phone = fd.get('phone') || c.phone;
      c.whatsapp = fd.get('whatsapp') || c.whatsapp;
      c.email = fd.get('email') || c.email;
      c.city = fd.get('city') || c.city;
      c.address = fd.get('address') || c.address;
      c.altContact = fd.get('altContact') || c.altContact;
      c.nextRecommendedVisit = fd.get('nextRecommendedVisit') || c.nextRecommendedVisit;
      c.contactNotes = fd.get('contactNotes') || '';
      c.whatsappConsent = Boolean(fd.get('whatsappConsent'));
      c.whatsappRemindersEnabled = Boolean(fd.get('whatsappConsent'));
      if (c.whatsappConsent && !c.whatsappConsentDate) {
        c.whatsappConsentDate = '2026-10-15 13:00';
      }
      c.fiscal.rfc = newRfc;
      c.fiscal.postalCode = fd.get('postalCode') || '47600';
      c.fiscal.legalName = (fd.get('legalName') || '').toUpperCase();
      c.fiscal.taxRegime = fd.get('taxRegime') || c.fiscal.taxRegime;
      c.fiscal.cfdiUse = fd.get('cfdiUse') || c.fiscal.cfdiUse;
      c.fiscal.fiscalEmail = fd.get('fiscalEmail') || c.email;

      saveDatabase();
      logAudit('Actualización de datos de cliente', c.id, 'Se actualizaron datos personales y fiscales CFDI 4.0');
      renderApp();
      showToast('Expediente actualizado', 'Los datos personales y fiscales se guardaron correctamente.', 'success');
    }

    function addCustomerInternalNote(customerId, text) {
      const c = DB.customers.find(x => x.id === customerId);
      if (!c || !text.trim()) return;
      const u = getCurrentUser();
      c.internalNotes.unshift({
        id: 'NT-' + Math.floor(100 + Math.random() * 900),
        date: new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16),
        author: u.name,
        role: u.role,
        text: text.trim()
      });
      saveDatabase();
      logAudit('Nueva nota interna', c.id, text.trim());
      renderApp();
      showToast('Nota interna guardada', 'Se anexó a la línea de tiempo del expediente.', 'success');
    }

    // Reutilizar Fórmula directamente en Venta (POS) y Pedido de Laboratorio
    function reusePrescriptionInSaleAndOrder(rxId) {
      const rx = DB.prescriptions.find(r => r.id === rxId);
      if (!rx) return;
      APP_STATE.posCustomerId = rx.customerId;
      APP_STATE.posLinkedPrescriptionId = rx.id;
      const existingOrder = DB.orders.find(o => o.prescriptionId === rx.id);
      APP_STATE.posLinkedOrderId = existingOrder ? existingOrder.id : '';
      APP_STATE.posCart = [
        { productId: 'PRD-01', name: `Armazón Óptico para Receta ${rx.id}`, qty: 1, unitPrice: 3290.00 },
        { productId: 'PRD-04', name: `${rx.lensType} (${rx.material} • ${rx.treatment}) [OD ${rx.od.sphere} ${rx.od.cylinder}x${rx.od.axis}° / OI ${rx.oi.sphere} ${rx.oi.cylinder}x${rx.oi.axis}°]`, qty: 1, unitPrice: 1660.00 }
      ];
      if ((rx.includedItems || []).includes('Lentes de contacto/pupilentes')) {
        APP_STATE.posCart.push({
          productId: 'PRD-06',
          name: 'Caja 6 Pupilentes Biofinity (Adaptados en consulta)',
          qty: 1,
          unitPrice: 1350.00
        });
      }
      APP_STATE.posPayNowAmount = 2000.00;
      navigateTo('pos');
      showToast('Fórmula cargada en Punto de Venta y Pedido', `Se precargaron los parámetros de ${rx.id} (OD ${rx.od.sphere} / OI ${rx.oi.sphere}) listos para generar venta y orden a laboratorio.`, 'success');
    }

    function saveAmendedPrescription(rxId, form) {
      const rx = DB.prescriptions.find(r => r.id === rxId);
      if (!rx) return;
      const fd = new FormData(form);
      const u = getCurrentUser();
      rx.versions = rx.versions || [];
      rx.versions.unshift({
        version: rx.version,
        date: new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16),
        user: u.name,
        reason: fd.get('reason') || 'Ajuste clínico',
        snapshot: {
          od: { ...rx.od },
          oi: { ...rx.oi },
          dpBinocular: rx.dpBinocular
        }
      });
      rx.version += 1;
      rx.signed = true;
      rx.signedAt = new Date().toISOString();
      rx.od.sphere = fd.get('od_sphere') || rx.od.sphere;
      rx.od.cylinder = fd.get('od_cyl') || rx.od.cylinder;
      rx.od.axis = fd.get('od_axis') || rx.od.axis;
      rx.od.add = fd.get('od_add') || '';
      rx.oi.sphere = fd.get('oi_sphere') || rx.oi.sphere;
      rx.oi.cylinder = fd.get('oi_cyl') || rx.oi.cylinder;
      rx.oi.axis = fd.get('oi_axis') || rx.oi.axis;
      rx.oi.add = fd.get('oi_add') || '';

      saveDatabase();
      logAudit('Nueva versión de fórmula firmada', rx.id, `Versión ${rx.version} guardada. Motivo: ${fd.get('reason')}`);
      closeModal();
      renderApp();
      showToast(`Fórmula ${rx.id} actualizada a v${rx.version}`, 'La versión anterior quedó resguardada en el historial de auditoría.', 'success');
    }

    function generateClientAiAnalysis(c, mode = 'full') {
      const consults = DB.consultations.filter(x => x.customerId === c.id);
      const rxs = DB.prescriptions.filter(x => x.customerId === c.id);
      const orders = DB.orders.filter(x => x.customerId === c.id);
      const files = DB.files.filter(x => x.customerId === c.id);
      const sales = DB.sales.filter(x => x.customerId === c.id);
      const lastCon = consults[0] || null;
      const latestRx = rxs[0] || null;
      const prevRx = rxs[1] || null;
      const totalBalance = sales.reduce((a, b) => a + b.balance, 0);

      // Detectar datos faltantes reales en el expediente
      const missingData = [];
      if (!c.whatsappConsent) missingData.push('Falta firma de autorización de consentimiento para recordatorios por WhatsApp (Dato faltante en perfil de cliente).');
      if (c.fiscal?.rfc === 'XAXX010101000') missingData.push('RFC registrado como Público en General (XAXX010101000). Confirmar si requiere factura personalizada.');
      if (latestRx && !latestRx.signed) missingData.push(`La fórmula ${latestRx.id} del ${MX_FMT.date(latestRx.date)} aún se encuentra pendiente de firma de la optometrista.`);
      if (files.filter(f => f.category === 'Estudio').length === 0) missingData.push('No se han cargado estudios clínicos (topografía, retinografía o campimetría) en PDF/JPG.');
      if (c.id === 'CLI-1004') missingData.push('Paciente con antecedente metabólico (CON-304, 28/09/2026): falta registrar reporte reciente de HbA1c y campimetría.');

      // Comparación de graduaciones
      let rxComparisonHtml = '';
      if (latestRx && prevRx) {
        const diffOdSph = (parseFloat(latestRx.od.sphere) - parseFloat(prevRx.od.sphere)).toFixed(2);
        const diffOdCyl = (parseFloat(latestRx.od.cylinder) - parseFloat(prevRx.od.cylinder)).toFixed(2);
        const diffOiSph = (parseFloat(latestRx.oi.sphere) - parseFloat(prevRx.oi.sphere)).toFixed(2);
        rxComparisonHtml = `
          Comparación entre ${prevRx.id} (${prevRx.date}) y ${latestRx.id} (${latestRx.date}):
          • Ojo Derecho (OD): Esfera pasó de ${prevRx.od.sphere} a ${latestRx.od.sphere} (Δ ${diffOdSph} D) y Cilindro pasó de ${prevRx.od.cylinder} a ${latestRx.od.cylinder} (Δ ${diffOdCyl} D). [Fuente: ${latestRx.id} v${latestRx.version} — Confirmado].
          • Ojo Izquierdo (OI): Esfera pasó de ${prevRx.oi.sphere} a ${latestRx.oi.sphere} (Δ ${diffOiSph} D), Cilindro estable en ${latestRx.oi.cylinder} eje ${latestRx.oi.axis}°. [Fuente: ${latestRx.id} — Confirmado].
        `;
      } else if (latestRx) {
        rxComparisonHtml = `Única fórmula registrada en sistema: ${latestRx.id} (${latestRx.date}) — OD ${latestRx.od.sphere} ${latestRx.od.cylinder} x ${latestRx.od.axis}° | OI ${latestRx.oi.sphere} ${latestRx.oi.cylinder} x ${latestRx.oi.axis}°. No existen fórmulas previas para calcular delta histórico. [Fuente: ${latestRx.id} — Confirmado].`;
      } else {
        rxComparisonHtml = 'Sin graduaciones registradas en el expediente.';
      }

      // Diferencia relevante entre OD y OI (Anisometropía / Cilindro)
      let odOiDiffText = 'Sin datos refractivos.';
      if (latestRx) {
        const sphGap = Math.abs(parseFloat(latestRx.od.sphere) - parseFloat(latestRx.oi.sphere)).toFixed(2);
        const cylGap = Math.abs(parseFloat(latestRx.od.cylinder) - parseFloat(latestRx.oi.cylinder)).toFixed(2);
        odOiDiffText = `Diferencia esférica interocular OD vs OI de ${sphGap} D y diferencia cilíndrica de ${cylGap} D. Agudeza visual corregida: OD ${latestRx.od.va} y OI ${latestRx.oi.va}. [Fecha: ${latestRx.date} | Fuente: Fórmula ${latestRx.id} — Confirmado].`;
      }

      return {
        generatedAt: new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16),
        mode,
        generalSummary: `Paciente ${c.firstName} ${c.lastName} (${c.internalCode}), alta el ${c.createdAt} y última visita el ${c.lastVisit}. Cuenta con ${consults.length} consulta(s), ${rxs.length} fórmula(s) y ${orders.length} pedido(s) registrados. [Fuente: Ficha CLI ${c.id} — Confirmado].`,
        lastConsultSummary: lastCon
          ? `Última consulta ${lastCon.id} (${lastCon.date} ${lastCon.time}) por "${lastCon.reason}". Anamnesis: ${lastCon.anamnesis}. Se trabajaron categorías: ${lastCon.includedCategories.join(', ')}. [Fuente: ${lastCon.id} por ${lastCon.optometrist} — Confirmado].`
          : 'Sin consultas registradas.',
        rxComparison: rxComparisonHtml,
        odOiChanges: odOiDiffText,
        lensUsageHistory: latestRx
          ? `Material actual indicado: ${latestRx.material} en diseño ${latestRx.lensType} con tratamiento ${latestRx.treatment}. Uso indicado: ${latestRx.recommendedUse}. [Fecha: ${latestRx.date} | Fuente: ${latestRx.id} — Confirmado].`
          : 'Sin historial de uso de lentes.',
        pendingOrders: orders.filter(o => o.status !== 'Entregado').map(o => `${o.id} (${o.status}): ${o.items.map(i => i.name).join(' + ')} — Prometido ${o.promisedDate}, Saldo ${MX_FMT.currency(o.balance)} [Fuente: Módulo Pedidos — Confirmado]`).join(' || ') || 'Todos los pedidos han sido entregados.',
        recentStudies: files.map(f => `[${f.studyDate}] ${f.category} "${f.name}": ${f.extractedAiText || f.description} [Fuente: Archivo ${f.id} cargado por ${f.uploadedBy} — Confirmado]`).join(' || ') || 'Sin archivos autorizados.',
        missingDataList: missingData.length ? missingData : ['Expediente completo sin omisiones críticas detectadas.'],
        suggestedQuestions: [
          `Confirmar adaptación visual tras cambio en graduación (${latestRx ? latestRx.id : 'última receta'}) durante uso prolongado de pantallas [Inferido a partir de motivos de consulta y notas].`,
          `Verificar si el paciente alterna adecuadamente lentes de armazón y pupilentes sin exceder 8 horas continuas [Inferido de recomendaciones de uso].`,
          `Confirmar horario preferido para entrega y liquidación de saldo pendiente de ${MX_FMT.currency(totalBalance)} [Fuente: Cuentas por Cobrar].`
        ],
        contradictionAlerts: [
          ...(latestRx && !latestRx.signed ? [`Alerta: Existe un pedido activo (${orders[0]?.id || 'en curso'}) vinculado a la fórmula ${latestRx.id} que aún no tiene firma definitiva de la optometrista.`] : []),
          ...(c.fiscal?.history?.length ? [`Nota histórica: El régimen fiscal del cliente cambió respecto a 2025 (${c.fiscal.history[0].note}). Verificar antes de timbrar CFDI 4.0.`] : ['No se detectaron contradicciones entre las consultas y los archivos cargados.'])
        ],
        adminRecommendations: `Programar recordatorio de seguimiento para ${c.nextRecommendedVisit}. ${totalBalance > 0 ? `Gestionar cobro de saldo pendiente (${MX_FMT.currency(totalBalance)}) previo o durante la entrega.` : 'Cuenta sin adeudos pendientes.'}`
      };
    }

    function copyAiSummaryToClipboard(customerId) {
      const c = DB.customers.find(x => x.id === customerId) || DB.customers[0];
      const a = generateClientAiAnalysis(c);
      const text = `RESUMEN IA ÓPTICA DENS — ${c.firstName} ${c.lastName}\nAdvertencia: Este resumen es una herramienta de apoyo y no sustituye el criterio profesional de la optometrista.\n\n1) ${a.generalSummary}\n2) ${a.lastConsultSummary}\n3) ${a.rxComparison}\n4) ${a.odOiChanges}\n5) Datos faltantes: ${a.missingDataList.join('; ')}`;
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      } catch (e) {}
      showToast('Resumen copiado al portapapeles', 'Listo para pegar en referencia interconsulta o nota.', 'success');
    }

    function saveNewAppointment(form) {
      const fd = new FormData(form);
      let custId = fd.get('customerId');
      let custName = '';
      let custPhone = '';

      if (custId === 'NEW_CUSTOMER' || (fd.get('newCustomerName') || '').trim()) {
        const rawName = (fd.get('newCustomerName') || 'Cliente Nuevo Cita').trim();
        const parts = rawName.split(' ');
        const firstName = parts[0] || 'Cliente';
        const lastName = parts.slice(1).join(' ') || 'Cita';
        const nextNum = 1001 + DB.customers.length;
        custId = 'CLI-' + nextNum;
        custPhone = fd.get('newCustomerPhone') || '378 100 9900';
        custName = rawName;
        DB.customers.unshift({
          id: custId,
          branchId: DB.meta.activeBranchId,
          internalCode: 'OD-00' + (101 + DB.customers.length),
          customerCode: custId,
          barcode: '7509988' + Math.floor(10000 + Math.random() * 89999),
          firstName,
          lastName,
          birthDate: '1995-01-01',
          sex: 'No especificado',
          phone: custPhone,
          whatsapp: '52' + custPhone.replace(/\D/g, ''),
          email: 'cita@opticadens.mx',
          address: 'Por capturar en recepción',
          city: 'Tepatitlán de Morelos, Jal.',
          contactNotes: 'Creado directamente desde módulo de Agenda.',
          altContact: '',
          createdAt: '2026-10-15',
          lastVisit: '2026-10-15',
          nextRecommendedVisit: '2027-10-15',
          contactPreference: 'WhatsApp',
          whatsappConsent: true,
          whatsappConsentDate: '2026-10-15 13:00',
          whatsappRemindersEnabled: true,
          fiscal: { rfc: 'XAXX010101000', legalName: rawName.toUpperCase(), postalCode: '47600', taxRegime: '616 - Sin obligaciones fiscales', cfdiUse: 'S01 - Sin efectos fiscales', fiscalEmail: '', history: [] },
          alerts: [],
          internalNotes: []
        });
      } else {
        const c = DB.customers.find(x => x.id === custId) || DB.customers[0];
        custName = c.firstName + ' ' + c.lastName;
        custPhone = c.phone;
      }

      const newAppt = {
        id: 'CIT-' + (905 + DB.appointments.length),
        branchId: DB.meta.activeBranchId,
        customerId: custId,
        customerName: custName,
        customerPhone: custPhone,
        date: fd.get('date') || '2026-10-15',
        time: fd.get('time') || '17:30',
        durationMin: Number(fd.get('durationMin')) || 45,
        type: fd.get('type') || 'Examen visual',
        status: 'Confirmada',
        doctor: 'Dra. Sofía Mendoza',
        notes: fd.get('notes') || 'Agendada desde recepción',
        whatsappReminderSent: false,
        whatsappReminderSentAt: null
      };

      DB.appointments.unshift(newAppt);
      saveDatabase();
      closeModal();
      dispatchSystemNotification('Nueva cita', `Cita de ${newAppt.type} para ${custName} el ${MX_FMT.date(newAppt.date)} a las ${newAppt.time} hrs.`, 'Dra. Sofía Mendoza (Optometrista)');
      renderApp();
    }

    function toggleCustomerWhatsappReminder(custId) {
      const c = DB.customers.find(x => x.id === custId);
      if (!c) return;
      c.whatsappConsent = !c.whatsappConsent;
      c.whatsappRemindersEnabled = c.whatsappConsent;
      if (c.whatsappConsent) c.whatsappConsentDate = '2026-10-15 13:15';
      saveDatabase();
      renderApp();
      showToast('Preferencia WhatsApp actualizada', `${c.firstName}: ${c.whatsappConsent ? 'Recordatorios activados con consentimiento registrado' : 'Recordatorios desactivados'}`, 'info');
    }

    function sendManualWhatsAppReminder(apptId) {
      const a = DB.appointments.find(x => x.id === apptId);
      if (!a) return;
      const c = DB.customers.find(x => x.id === a.customerId);
      if (c && (!c.whatsappConsent || !c.whatsappRemindersEnabled)) {
        showToast('Envío bloqueado por privacidad', `${a.customerName} tiene desactivada la autorización de WhatsApp. Respeta su preferencia o solicita su consentimiento.`, 'warn');
        return;
      }
      a.whatsappReminderSent = true;
      a.whatsappReminderSentAt = '2026-10-15 13:20';
      saveDatabase();
      renderApp();
      showToast('Recordatorio WhatsApp Business enviado', `Plantilla oficial enviada a ${a.customerName} (${a.customerPhone}).`, 'success');
    }

    // ============================================================================
    // 16. LECTURA DE TICKETS DE PROVEEDORES CON OCR + IA (SECCIÓN 9 COMPLETA)
    // ============================================================================
    function computeTicketMatches(ticket) {
      // Calcula máximo 5 coincidencias con nivel y razones explícitas
      const matches = DB.customers.map(c => {
        const custOrders = DB.orders.filter(o => o.customerId === c.id);
        const custRx = DB.prescriptions.filter(r => r.customerId === c.id)[0];
        const activeOrd = custOrders[0];
        let score = 35;
        const reasons = [];

        const detName = (ticket.detected.customerName || '').toLowerCase();
        if (detName.includes(c.firstName.split(' ')[0].toLowerCase()) || detName.includes(c.lastName.split(' ')[0].toLowerCase())) {
          score += 38;
          reasons.push('Nombre y apellidos coinciden fonética y textualmente');
        }
        if ((ticket.detected.customerCode || '').includes(c.internalCode) || (ticket.detected.customerCode || '').includes(c.id)) {
          score += 18;
          reasons.push(`Código de cliente (${c.internalCode}) detectado en remisión`);
        }
        if (custRx && (ticket.detected.graduation || '').includes(custRx.od.sphere)) {
          score += 15;
          reasons.push(`Graduación OD (${custRx.od.sphere} ${custRx.od.cylinder}) idéntica a receta ${custRx.id}`);
        }
        if (activeOrd && (ticket.detected.frameCode || '').includes('RB5154') && c.id === 'CLI-1001') {
          score += 10;
          reasons.push('Código de armazón RB5154 coincide con pedido activo PED-501');
        }
        if (reasons.length === 0) {
          reasons.push('Coincidencia parcial por fecha de lote de laboratorio');
        }

        return {
          customer: c,
          activeOrder: activeOrd,
          rx: custRx,
          score: Math.min(99, score),
          reasons
        };
      });

      return matches.sort((a, b) => b.score - a.score).slice(0, 5);
    }

    function saveManualOcrEdits(ticketId, form) {
      const t = DB.ocrTicketsQueue.find(x => x.id === ticketId);
      if (!t) return;
      const fd = new FormData(form);
      Object.keys(t.detected).forEach(k => {
        if (fd.has(k)) {
          t.detected[k] = ['price', 'deposit', 'balance'].includes(k) ? Number(fd.get(k)) : fd.get(k);
        }
      });
      saveDatabase();
      renderApp();
      showToast('Datos de ticket corregidos manualmente', 'Las coincidencias sugeridas se recalcularon con los datos corregidos.', 'success');
    }

    function confirmOcrTicketToOrder(ticketId, customerId, orderId) {
      const t = DB.ocrTicketsQueue.find(x => x.id === ticketId);
      const c = DB.customers.find(x => x.id === customerId);
      if (!t || !c) return;
      const ord = DB.orders.find(o => o.id === orderId) || DB.orders.find(o => o.customerId === customerId);
      if (ord) {
        ord.supplierTicketCode = t.detected.orderNumber;
        ord.trackingNumber = t.detected.trackingNumber || ord.trackingNumber;
        ord.status = 'Recibido en óptica';
        ord.receivedDate = '2026-10-15';
        ord.history.unshift({
          date: new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16),
          status: 'Recibido en óptica',
          user: getCurrentUser().name,
          note: `Ticket ${t.detected.orderNumber} confirmado manualmente y vinculado.`
        });
      }
      t.status = `Confirmado y vinculado a ${c.firstName} ${c.lastName} (${ord ? ord.id : 'Nuevo'})`;
      DB.files.unshift({
        id: 'FIL-' + (710 + DB.files.length),
        customerId: c.id,
        consultationId: 'CON-301',
        orderId: ord ? ord.id : 'PED-501',
        name: t.rawImageName,
        mimeType: 'image/jpeg',
        category: 'Ticket de proveedor',
        studyDate: t.detected.date,
        uploadedAt: new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16),
        uploadedBy: getCurrentUser().name,
        visibility: ['ADMIN', 'OPTOMETRIST', 'RECEPTION'],
        description: `Ticket proveedor ${t.detected.supplier} #${t.detected.orderNumber} (${t.detected.product})`,
        extractedAiText: `Ticket proveedor confirmado: ${t.detected.graduation} - ${t.detected.product}`,
        history: [{ date: '2026-10-15', user: getCurrentUser().name, action: 'Confirmación humana en módulo OCR' }]
      });
      saveDatabase();
      logAudit('Confirmación humana de ticket OCR', ticketId, `Asignado a ${c.id} (${c.firstName} ${c.lastName})`);
      renderApp();
      showToast('Ticket confirmado y vinculado', `Se guardó la imagen original en el expediente de ${c.firstName} y se actualizó el pedido ${ord ? ord.id : ''}.`, 'success');
    }

    function saveInventoryMovement(form) {
      const fd = new FormData(form);
      const item = DB.inventory.find(x => x.id === fd.get('productId'));
      if (!item) return;
      const qty = Number(fd.get('qty')) || 1;
      const t = fd.get('moveType');
      if (t === 'IN' || t === 'RETURN' || t === 'ADJUST') {
        item.stock += qty;
      } else {
        item.stock = Math.max(0, item.stock - qty);
      }
      item.status = item.stock <= item.minStock ? 'Stock Bajo' : 'Disponible';
      saveDatabase();
      logAudit('Movimiento de inventario', item.internalCode, `Tipo ${t} por ${qty} unidades. Existencia final: ${item.stock}`);
      closeModal();
      renderApp();
      showToast('Inventario actualizado', `${item.brand} ${item.model}: Nueva existencia ${item.stock} pzas.`, 'success');
    }

    function addProductToPosCart(productId) {
      const p = DB.inventory.find(x => x.id === productId);
      if (!p) return;
      const existing = APP_STATE.posCart.find(i => i.productId === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        APP_STATE.posCart.push({
          productId: p.id,
          name: `${p.brand} ${p.model}`,
          qty: 1,
          unitPrice: p.price
        });
      }
      const total = APP_STATE.posCart.reduce((a, b) => a + b.qty * b.unitPrice, 0) - (Number(APP_STATE.posDiscount) || 0);
      APP_STATE.posPayNowAmount = Math.max(0, total);
      renderApp();
      showToast('Producto agregado al ticket', `${p.brand} ${p.model} (${MX_FMT.currency(p.price)})`, 'info');
    }

    function updatePosCartQty(idx, delta) {
      if (!APP_STATE.posCart[idx]) return;
      APP_STATE.posCart[idx].qty += delta;
      if (APP_STATE.posCart[idx].qty <= 0) {
        APP_STATE.posCart.splice(idx, 1);
      }
      const total = APP_STATE.posCart.reduce((a, b) => a + b.qty * b.unitPrice, 0) - (Number(APP_STATE.posDiscount) || 0);
      APP_STATE.posPayNowAmount = Math.max(0, total);
      renderApp();
    }

    function completePosSale(andInvoice = false) {
      if (!APP_STATE.posCart.length) {
        showToast('Carrito vacío', 'Agrega al menos un producto o servicio para registrar la venta.', 'warn');
        return;
      }
      const c = DB.customers.find(x => x.id === APP_STATE.posCustomerId) || DB.customers[0];
      const subtotal = APP_STATE.posCart.reduce((a, b) => a + b.qty * b.unitPrice, 0);
      const discount = Number(APP_STATE.posDiscount) || 0;
      const total = Math.max(0, subtotal - discount);
      const paidAmount = Math.min(total, Number(APP_STATE.posPayNowAmount) || 0);
      const balance = Math.max(0, total - paidAmount);

      const saleId = 'VTA-' + (810 + DB.sales.length);
      const ordId = 'PED-' + (510 + DB.orders.length);

      // Crear pedido automáticamente si tiene graduación o armazón
      DB.orders.unshift({
        id: ordId,
        branchId: DB.meta.activeBranchId,
        customerId: c.id,
        customerName: c.firstName + ' ' + c.lastName,
        consultationId: 'CON-301',
        prescriptionId: APP_STATE.posLinkedPrescriptionId || 'RX-401',
        saleId,
        supplier: 'Laboratorio Óptico Alteño',
        supplierTicketCode: 'EN-PROCESO',
        trackingNumber: 'LOCAL',
        status: balance > 0 ? 'Pedido recibido' : 'En proceso',
        createdAt: '2026-10-15',
        promisedDate: '2026-10-20',
        receivedDate: '',
        responsible: getCurrentUser().name,
        items: APP_STATE.posCart.map(i => ({ productId: i.productId, type: 'Producto POS', name: i.name, qty: i.qty, price: i.unitPrice, cost: i.unitPrice * 0.45 })),
        totalPrice: total,
        totalCost: total * 0.45,
        deposit: paidAmount,
        balance,
        notes: 'Generado desde Punto de Venta.',
        history: [{ date: '2026-10-15 13:45', status: 'Pedido recibido', user: getCurrentUser().name, note: `Venta ${saleId} registrada` }]
      });

      DB.sales.unshift({
        id: saleId,
        branchId: DB.meta.activeBranchId,
        customerId: c.id,
        customerName: c.firstName + ' ' + c.lastName,
        orderId: ordId,
        prescriptionId: APP_STATE.posLinkedPrescriptionId || null,
        date: '2026-10-15',
        time: '13:45',
        subtotal,
        discount,
        total,
        paidAmount,
        balance,
        dueDate: '2026-10-25',
        status: balance > 0 ? 'Con saldo pendiente' : 'Pagada',
        invoiced: false,
        invoiceId: null,
        seller: getCurrentUser().name,
        items: APP_STATE.posCart.map(i => ({ ...i, total: i.qty * i.unitPrice }))
      });

      if (paidAmount > 0) {
        DB.payments.unshift({
          id: 'PAG-' + (615 + DB.payments.length),
          saleId,
          orderId: ordId,
          customerId: c.id,
          customerName: c.firstName + ' ' + c.lastName,
          date: '2026-10-15 13:45',
          amount: paidAmount,
          method: APP_STATE.posPaymentMethod,
          type: balance > 0 ? 'Anticipo' : 'Pago Total',
          user: getCurrentUser().name,
          notes: `Cobro en POS (${APP_STATE.posPaymentMethod})`
        });
        DB.cashRegister.movements.unshift({
          id: 'CAJ-' + (10 + DB.cashRegister.movements.length),
          date: '2026-10-15 13:45',
          type: 'Ingreso (Venta)',
          method: APP_STATE.posPaymentMethod,
          amount: paidAmount,
          concept: `Venta ${saleId} — ${c.firstName} ${c.lastName}`,
          user: getCurrentUser().name
        });
      }

      APP_STATE.posCart = [];
      APP_STATE.posDiscount = 0;
      APP_STATE.posPayNowAmount = 0;
      saveDatabase();
      logAudit('Registro de venta POS', saleId, `Total ${MX_FMT.currency(total)}, Pagado ${MX_FMT.currency(paidAmount)}, Saldo ${MX_FMT.currency(balance)}`);

      if (andInvoice) {
        stampCfdiForSale(saleId);
        navigateTo('billing');
      } else {
        renderApp();
        showToast(`Venta ${saleId} y Pedido ${ordId} registrados`, `Cobrado hoy: ${MX_FMT.currency(paidAmount)} • Saldo en Cuentas por Cobrar: ${MX_FMT.currency(balance)}.`, 'success');
      }
    }

    function savePaymentInstallment(form) {
      const fd = new FormData(form);
      const sale = DB.sales.find(s => s.id === fd.get('saleId'));
      if (!sale) return;
      const amount = Math.min(sale.balance > 0 ? sale.balance : 99999, Number(fd.get('amount')) || 0);
      const method = fd.get('method') || 'Efectivo';
      const now = new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16);

      sale.paidAmount += amount;
      sale.balance = Math.max(0, sale.total - sale.paidAmount);
      sale.status = sale.balance === 0 ? 'Pagada' : 'Con saldo pendiente';

      const ord = DB.orders.find(o => o.id === sale.orderId);
      if (ord) {
        ord.deposit += amount;
        ord.balance = sale.balance;
      }

      DB.payments.unshift({
        id: 'PAG-' + (620 + DB.payments.length),
        saleId: sale.id,
        orderId: sale.orderId || 'N/A',
        customerId: sale.customerId,
        customerName: sale.customerName,
        date: now,
        amount,
        method,
        type: sale.balance === 0 ? 'Liquidación' : 'Abono',
        user: getCurrentUser().name,
        notes: fd.get('notes') || 'Abono a cuenta'
      });

      DB.cashRegister.movements.unshift({
        id: 'CAJ-' + (20 + DB.cashRegister.movements.length),
        date: now,
        type: 'Ingreso (Abono)',
        method,
        amount,
        concept: `Abono a ${sale.id} (${sale.customerName})`,
        user: getCurrentUser().name
      });

      saveDatabase();
      logAudit('Registro de abono', sale.id, `Abono de ${MX_FMT.currency(amount)} (${method}). Saldo restante: ${MX_FMT.currency(sale.balance)}`);
      closeModal();
      dispatchSystemNotification('Abono recibido', `${sale.customerName} abonó ${MX_FMT.currency(amount)} (${method}). Saldo restante: ${MX_FMT.currency(sale.balance)}.`, 'Valeria Gómez (Recepción)');
      renderApp();
    }

    function stampCfdiForSale(saleId, customUse = '') {
      const s = DB.sales.find(x => x.id === saleId) || DB.sales[0];
      const c = DB.customers.find(x => x.id === s.customerId) || DB.customers[0];
      const folio = DB.cfdiConfig.nextFolio++;
      const serieFolio = `${DB.cfdiConfig.series}-${folio}`;
      const subtotal = Number((s.total / 1.16).toFixed(2));
      const iva = Number((s.total - subtotal).toFixed(2));
      const uuid = '9A44F102-' + Math.floor(1000 + Math.random() * 8999) + '-4C20-B812-00AA11BB22CC';

      const newInv = {
        id: 'FAC-' + folio,
        serieFolio,
        uuid,
        saleId: s.id,
        customerId: c.id,
        customerName: c.fiscal?.legalName || (c.firstName + ' ' + c.lastName).toUpperCase(),
        rfc: c.fiscal?.rfc || 'XAXX010101000',
        postalCode: c.fiscal?.postalCode || '47600',
        taxRegime: c.fiscal?.taxRegime || '616 - Sin obligaciones fiscales',
        cfdiUse: customUse || c.fiscal?.cfdiUse || 'D01 - Honorarios médicos, dentales y gastos hospitalarios',
        paymentMethodSat: s.balance > 0 ? 'PPD - Pago en parcialidades o diferido' : 'PUE - Pago en una sola exhibición',
        paymentFormSat: '04 - Tarjeta / 01 - Efectivo',
        subtotal,
        iva,
        total: s.total,
        date: new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16),
        environment: DB.cfdiConfig.pacConfigured ? 'PRODUCCIÓN' : 'PRUEBAS',
        status: DB.cfdiConfig.pacConfigured ? 'Timbrada Vigente' : 'Timbrada (Entorno Pruebas)',
        cancelReason: null
      };

      s.invoiced = true;
      s.invoiceId = newInv.id;
      DB.invoices.unshift(newInv);
      saveDatabase();
      logAudit('Timbrado CFDI 4.0', serieFolio, `UUID ${uuid} para ${newInv.rfc} por ${MX_FMT.currency(newInv.total)}`);
      renderApp();
      showToast(`Factura ${serieFolio} timbrada`, `UUID: ${uuid} (${newInv.environment}). Ya puedes descargar el XML y PDF.`, 'success');
    }

    function downloadCfdiXml(invId) {
      const inv = DB.invoices.find(x => x.id === invId);
      if (!inv) return;
      const xml = `<?xml version="1.0" encoding="UTF-8"?>
<cfdi:Comprobante xmlns:cfdi="http://www.sat.gob.mx/cfd/4" Version="4.0" Serie="${DB.cfdiConfig.series}" Folio="${inv.serieFolio}" Fecha="${inv.date.replace(' ', 'T')}:00" SubTotal="${inv.subtotal.toFixed(2)}" Moneda="MXN" Total="${inv.total.toFixed(2)}" TipoDeComprobante="I" Exportacion="01" MetodoPago="${inv.paymentMethodSat.slice(0,3)}" LugarExpedicion="${DB.cfdiConfig.expeditionZip}">
  <cfdi:Emisor Rfc="${DB.cfdiConfig.issuerRfc}" Nombre="${DB.cfdiConfig.issuerLegalName}" RegimenFiscal="601"/>
  <cfdi:Receptor Rfc="${inv.rfc}" Nombre="${inv.customerName}" DomicilioFiscalReceptor="${inv.postalCode}" RegimenFiscalReceptor="${inv.taxRegime.slice(0,3)}" UsoCFDI="${inv.cfdiUse.slice(0,3)}"/>
  <cfdi:Conceptos>
    <cfdi:Concepto ClaveProdServ="85121800" Cantidad="1" ClaveUnidad="E48" Descripcion="Lentes opticos graduados y servicios de optometria (Venta ${inv.saleId})" ValorUnitario="${inv.subtotal.toFixed(2)}" Importe="${inv.subtotal.toFixed(2)}" ObjetoImp="02"/>
  </cfdi:Conceptos>
  <cfdi:Complemento>
    <tfd:TimbreFiscalDigital Version="1.1" UUID="${inv.uuid}" FechaTimbrado="${inv.date.replace(' ', 'T')}:05"/>
  </cfdi:Complemento>
</cfdi:Comprobante>`;
      const blob = new Blob([xml], { type: 'application/xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${inv.serieFolio}_${inv.rfc}_CFDI40.xml`;
      a.click();
      showToast('Archivo XML CFDI 4.0 descargado', `${inv.serieFolio}_${inv.rfc}_CFDI40.xml`, 'success');
    }

    function saveCashMovement(form) {
      const fd = new FormData(form);
      const type = fd.get('type');
      const raw = Number(fd.get('amount')) || 0;
      const signed = (type === 'Gasto' || type === 'Retiro') ? -Math.abs(raw) : Math.abs(raw);
      DB.cashRegister.movements.unshift({
        id: 'CAJ-' + (30 + DB.cashRegister.movements.length),
        date: new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16),
        type,
        method: 'Efectivo',
        amount: signed,
        concept: fd.get('concept') || type,
        user: getCurrentUser().name
      });
      saveDatabase();
      closeModal();
      renderApp();
      showToast('Movimiento de caja registrado', `${type}: ${MX_FMT.currency(signed)}`, 'success');
    }

    function toggleCashRegisterCut() {
      DB.cashRegister.isOpen = !DB.cashRegister.isOpen;
      const now = new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16);
      if (!DB.cashRegister.isOpen) {
        const total = DB.cashRegister.movements.reduce((a, b) => a + b.amount, 0);
        DB.cashRegister.cutsHistory.unshift({
          id: 'CORTE-' + Math.floor(100 + Math.random() * 900),
          date: now,
          user: getCurrentUser().name,
          expectedCash: total,
          countedCash: total,
          difference: 0,
          totalDaySales: DB.sales.reduce((a, b) => a + b.total, 0),
          notes: 'Corte de caja realizado desde el sistema.'
        });
        logAudit('Cierre y corte de caja', 'CAJA-MATRIZ', `Saldo al corte: ${MX_FMT.currency(total)}`);
        showToast('Corte y cierre de caja completado', `Saldo arqueado: ${MX_FMT.currency(total)} sin diferencias.`, 'success');
      } else {
        DB.cashRegister.openedAt = now;
        DB.cashRegister.openedBy = getCurrentUser().name;
        showToast('Caja abierta', `Apertura registrada por ${getCurrentUser().name}.`, 'success');
      }
      saveDatabase();
      renderApp();
    }

    function updateNotificationTypeChannel(type, selection) {
      const r = DB.notificationsConfig.rulesByType[type];
      if (!r) return;
      if (selection === 'Apagado') {
        r.enabled = false;
        r.channel = 'Apagado';
      } else if (selection === 'Una vez al día') {
        r.enabled = true;
        r.channel = 'Ventana en sistema';
        r.frequency = 'Una vez al día';
      } else {
        r.enabled = true;
        r.channel = selection;
        r.frequency = 'Inmediata';
      }
      saveDatabase();
      renderApp();
      showToast(`Preferencia actualizada: ${type}`, `Canal: ${r.channel} (${r.frequency})`, 'info');
    }

    function toggleRevokeDevice(devId) {
      const d = DB.notificationsConfig.devices.find(x => x.id === devId);
      if (!d) return;
      d.revoked = !d.revoked;
      d.tokenStatus = d.revoked ? 'Revocado por Administrador' : 'Vigente';
      saveDatabase();
      logAudit('Control de dispositivos Push', d.name, d.revoked ? 'Dispositivo revocado' : 'Dispositivo reactivado');
      renderApp();
      showToast(d.revoked ? 'Dispositivo revocado' : 'Dispositivo reactivado', d.name, 'info');
    }

    function registerCurrentBrowserDeviceToken() {
      if ('Notification' in window && Notification.permission === 'default') {
        try { Notification.requestPermission(); } catch (e) {}
      }
      DB.notificationsConfig.devices.unshift({
        id: 'DEV-' + (10 + DB.notificationsConfig.devices.length),
        name: 'Navegador Actual — Sesión Activa (' + getCurrentUser().name + ')',
        user: getCurrentUser().name,
        token: 'fcm_tok_' + Math.random().toString(36).slice(2, 12) + '_web',
        registeredAt: new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16),
        lastConnection: 'Ahora mismo',
        permission: 'Concedido',
        tokenStatus: 'Vigente',
        revoked: false
      });
      saveDatabase();
      renderApp();
      showToast('Dispositivo actual registrado en FCM', 'Token Web Push generado y vinculado a tu usuario.', 'success');
    }

    function cleanExpiredFcmTokens() {
      DB.notificationsConfig.devices.forEach(d => {

    function handlePulposFileUpload(input) {
      const f = input.files && input.files[0];
      if (!f) return;
      DB.pulposMigration.lastIncompleteJob.fileName = f.name;

      renderApp();

    }

    function executePulposMigrationMerge() {
      const job = DB.pulposMigration.lastIncompleteJob;
      let mergedCount = 0;
      let createdCustomers = 0;
      let createdProducts = 0;

      job.stagingRows.forEach(r => {
        if (r.action === 'Fusionar sin duplicar' && r.duplicateMatchId) {
          mergedCount++;
        } else if (r.action === 'Importar como nuevo' && !r.error) {
          const exists = DB.customers.some(c => c.phone === r.phone);
          if (!exists) {
            const parts = r.name.split(' ');
            DB.customers.push({
              id: 'CLI-' + (1001 + DB.customers.length),
              branchId: DB.meta.activeBranchId,
              internalCode: 'OD-00' + (101 + DB.customers.length),
              customerCode: 'PULPOS-' + r.row,
              barcode: '7509988' + Math.floor(10000 + Math.random() * 89999),
              firstName: parts.slice(0, 2).join(' '),
              lastName: parts.slice(2).join(' ') || 'Pulpos',
              birthDate: '1985-05-10',
              sex: 'No especificado',
              phone: r.phone,
              whatsapp: '52' + r.phone.replace(/\D/g, ''),
              email: 'migrado.pulpos@opticadens.mx',
              address: 'Importado desde respaldo Pulpos',
              city: 'Tepatitlán de Morelos, Jal.',
              contactNotes: 'Migrado desde Pulpos sin duplicar registros.',
              altContact: '',
              createdAt: '2026-10-15',
              lastVisit: '2026-10-15',
              nextRecommendedVisit: '2027-10-15',
              contactPreference: 'WhatsApp',
              whatsappConsent: true,
              whatsappConsentDate: '2026-10-15',
              whatsappRemindersEnabled: true,
              fiscal: { rfc: r.rfc, legalName: r.name.toUpperCase(), postalCode: '47600', taxRegime: '612 - Personas Físicas', cfdiUse: 'G03 - Gastos en general', fiscalEmail: '', history: [] },
              alerts: [],
              internalNotes: []
            });
            createdCustomers++;
          }
        } else if (r.action === 'Importar producto') {
          createdProducts++;
        }
      });

      job.status = 'Importación completada sin duplicados';
      job.processedRows = job.totalRows;
      DB.pulposMigration.logs.unshift({
        id: 'LOG-MIG-' + (DB.pulposMigration.logs.length + 1),
        date: new Date().toLocaleString('sv-SE', { timeZone: 'America/Mexico_City' }).slice(0, 16),
        user: getCurrentUser().name,
        file: job.fileName,
        result: `Fusionados: ${mergedCount} clientes • Nuevos: ${createdCustomers} clientes • Productos: ${createdProducts} • Filas con error omitidas: 1`
      });

      saveDatabase();
      logAudit('Migración desde Pulpos', job.fileName, `Clientes fusionados: ${mergedCount}, nuevos: ${createdCustomers}, 0 duplicados creados.`);
      renderApp();
      showToast('Migración desde Pulpos finalizada', `Se fusionaron ${mergedCount} clientes existentes y se agregaron ${createdCustomers} clientes nuevos sin duplicar registros.`, 'success');
    }
