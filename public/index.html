                class="px-3 py-1.5 rounded-xl font-bold ${pwa.enabledInConfig ? 'bg-densLime-500 text-slate-950' : 'bg-slate-200 text-slate-700'}">
                ${pwa.enabledInConfig ? 'Ventana PWA: ACTIVADA' : 'Ventana PWA: DESACTIVADA'}
              </button>
            </div>

            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-1.5">
              <div class="flex justify-between"><span>IP detectada en control:</span><strong class="font-mono text-densBlue-700">${MX_FMT.escape(rec.ip)}</strong></div>
              <div class="flex justify-between"><span>Dispositivo / Navegador:</span><strong>${MX_FMT.escape(rec.device)} (${MX_FMT.escape(rec.browser)})</strong></div>
              <div class="flex justify-between"><span>Apariciones acumuladas para esta IP:</span><strong class="text-sm ${rec.impressions >= 3 ? 'text-rose-600' : 'text-densBlue-700'}">${rec.impressions} de 3 máximo</strong></div>
              <div class="flex justify-between"><span>¿Instaló la PWA?:</span><strong>${rec.installed ? 'Sí (No vuelve a mostrarse)' : 'No aún'}</strong></div>
              <div class="flex justify-between"><span>¿Rechazó o alcanzó límite de 3?:</span><strong>${rec.rejectedPermanently || rec.impressions >= 3 ? 'Bloqueado para esta IP' : 'Permitido'}</strong></div>
            </div>

            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="triggerNextSimulatedPwaImpression()" class="px-3.5 py-2 rounded-xl bg-densBlue-600 hover:bg-densBlue-700 text-white font-bold flex items-center gap-1.5">
                <i data-lucide="eye" class="w-4 h-4"></i> Simular siguiente aparición para esta IP (+1)
              </button>
              <button type="button" onclick="resetPwaCounterForTesting()" class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold flex items-center gap-1.5">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reiniciar contador por IP para pruebas
              </button>
            </div>

            <div class="pt-2 border-t border-slate-200">
              <strong class="block text-slate-700 mb-1">Bitácora de apariciones por IP (${MX_FMT.escape(rec.ip)}):</strong>
              <div class="space-y-1 max-h-36 overflow-y-auto custom-scroll">
                ${rec.history.map(h => `
                  <div class="p-2 rounded bg-white border border-slate-200 text-[11px] flex justify-between">
                    <span>${MX_FMT.escape(h.action)}</span>
                    <span class="font-mono text-slate-400">${h.date}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Arquitectura Multi-Sucursal y Copias de Seguridad -->
          <div class="dens-card p-5 space-y-4 text-xs">
            <h3 class="text-sm font-bold text-slate-900 border-b border-slate-200 pb-3">Arquitectura Multi-Sucursal (Óptica Dens)</h3>
            <p class="text-slate-600">El sistema opera hoy en la Matriz, pero todas las tablas incluyen llave foránea <code class="font-mono bg-slate-100 px-1 rounded">branchId</code> lista para habilitar sucursales adicionales.</p>
            <div class="space-y-2">
              ${DB.branches.map(b => `
                <div class="p-3 rounded-xl border ${b.isMain ? 'border-densBlue-600 bg-densBlue-50/40' : 'border-slate-200 bg-slate-50'} flex items-center justify-between">
                  <div>
                    <p class="font-bold text-slate-900">${MX_FMT.escape(b.name)} (${b.code})</p>
                    <p class="text-[11px] text-slate-500">${MX_FMT.escape(b.address)} • Tel: ${MX_FMT.escape(b.phone)}</p>
                  </div>
                  <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${b.isMain ? 'bg-densLime-500 text-slate-950' : 'bg-slate-200 text-slate-700'}">${b.status}</span>
                </div>
              `).join('')}
            </div>

            <div class="pt-3 border-t border-slate-200 space-y-2">
              <h4 class="font-bold text-slate-900">Copias de Seguridad y Respaldo de Base de Datos</h4>
              <div class="flex flex-wrap gap-2">
                <button type="button" onclick="exportFullDatabaseBackup()" class="px-3.5 py-2 rounded-xl bg-densBlue-600 text-white font-bold flex items-center gap-1.5">
                  <i data-lucide="download" class="w-4 h-4"></i> Descargar Respaldo Completo JSON/SQL
                </button>
                <button type="button" onclick="resetDemoDatabaseWithConfirmation()" class="px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold">
                  Restaurar Datos Iniciales de Demostración
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function exportFullDatabaseBackup() {
      const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Respaldo_Optica_Dens_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      logAudit('Respaldo de Base de Datos', 'FULL-BACKUP', 'Se descargó copia de seguridad completa.');
      showToast('Copia de seguridad descargada', 'Respaldo íntegro de clientes, fórmulas, ventas y configuración.', 'success');
    }

    function resetDemoDatabaseWithConfirmation() {
      openModal('Confirmar Restauración de Base de Datos de Demostración', `
        <div class="space-y-4 text-xs">
          <p class="text-slate-700">¿Deseas restaurar los datos originales de demostración de Óptica Dens? Las historias clínicas firmadas de demostración se restablecerán a su estado inicial.</p>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-semibold">Cancelar</button>
            <button type="button" onclick="DB = getInitialSeedDatabase(); saveDatabase(); closeModal(); renderApp(); showToast('Datos restaurados', 'Base de datos reiniciada al estado de demostración.', 'info');" class="px-4 py-2 rounded-xl bg-rose-600 text-white font-bold">Sí, restaurar datos</button>
          </div>
        </div>
      `);
    }

    // ============================================================================
    // 25. SEGURIDAD, PRIVACIDAD, ROLES Y AUDITORÍA (SECCIÓN 18)
    // ============================================================================
    function renderAuditModule() {
      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
          <div>
            <h2 class="text-xl font-extrabold text-slate-900 flex items-center gap-2">
              <i data-lucide="shield-check" class="w-5 h-5 text-densBlue-600"></i>
              Seguridad Clínica, Usuarios, 2FA y Bitácora de Auditoría
            </h2>
            <p class="text-xs text-slate-500">Control de quién vio o modificó un expediente, historial inmutable de recetas firmadas, sesiones con expiración y permisos por rol.</p>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div class="dens-card p-5 space-y-3 text-xs">
            <h3 class="text-sm font-bold text-slate-900">Usuarios, Roles y Doble Autenticación (2FA)</h3>
            ${DB.users.map((u, idx) => `
              <div class="p-3 rounded-xl border border-slate-200 bg-slate-50 space-y-1.5">
                <div class="flex items-center justify-between">
                  <strong class="text-slate-900">${MX_FMT.escape(u.name)}</strong>
                  <span class="px-2 py-0.5 rounded bg-densBlue-100 text-densBlue-800 font-bold text-[10px]">${u.role}</span>
                </div>
                <p class="text-slate-500">${MX_FMT.escape(u.email)} • Últ. acceso: ${MX_FMT.dateTime(u.lastLogin)}</p>
                <div class="flex items-center justify-between pt-1">
                  <span class="text-[11px] font-semibold ${u.aiAuthorized ? 'text-purple-700' : 'text-slate-400'}">
                    ${u.aiAuthorized ? 'Autorizado Asistente IA' : 'Sin acceso a IA clínica'}
                  </span>
                  <button type="button" onclick="DB.users[${idx}].twoFactorEnabled = !DB.users[${idx}].twoFactorEnabled; saveDatabase(); renderApp();" class="px-2 py-0.5 rounded text-[10px] font-bold ${u.twoFactorEnabled ? 'bg-densLime-100 text-densLime-800' : 'bg-slate-200 text-slate-600'}">
                    2FA: ${u.twoFactorEnabled ? 'ACTIVO' : 'OPCIONAL'}
                  </button>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="lg:col-span-2 dens-card p-5 space-y-3 text-xs">
            <h3 class="text-sm font-bold text-slate-900">Registro Inmutable de Actividad y Auditoría de Expedientes</h3>
            <div class="space-y-2 max-h-[450px] overflow-y-auto custom-scroll pr-1">
              ${DB.auditLogs.map(a => `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="px-2 py-0.5 rounded bg-densBlue-600 text-white font-mono text-[10px] font-bold">${a.id}</span>
                      <strong class="text-slate-900">${MX_FMT.escape(a.action)}</strong>
                      <span class="text-densBlue-700 font-semibold">(${MX_FMT.escape(a.target)})</span>
                    </div>
                    <p class="text-slate-600 mt-1">${MX_FMT.escape(a.detail)}</p>
                  </div>
                  <div class="text-right text-[11px] text-slate-500 shrink-0">
                    <strong class="text-slate-800 block">${MX_FMT.escape(a.user)}</strong>
                    <span>${a.date}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ============================================================================
    // 26. SHELL PRINCIPAL RESPONSIVO (SIDEBAR ESCRITORIO + BARRA INFERIOR MÓVIL RECEPCIÓN)
    // ============================================================================
    function renderCurrentModuleContent() {
      switch (APP_STATE.activeModule) {
        case 'dashboard': return renderDashboardModule();
        case 'customers': return renderCustomersModule();
        case 'expediente': return renderExpedienteModule();
        case 'agenda': return renderAgendaModule();
        case 'orders': return renderOrdersModule();
        case 'ocr': return renderOcrTicketsModule();
        case 'pos': return renderPosModule();
        case 'receivables': return renderReceivablesModule();
        case 'inventory': return renderInventoryModule();
        case 'billing': return renderBillingModule();
        case 'cash': return renderCashAndReportsModule();
        case 'ai_assistant': return renderAiAssistantModule();
        case 'migration': return renderMigrationModule();
        case 'notifications': return renderNotificationsModule();
        case 'settings': return renderSettingsModule();
        case 'audit': return renderAuditModule();
        default: return renderDashboardModule();
      }
    }

    function executeGlobalQuickSearch(q) {
      APP_STATE.globalSearchQuery = q;
      if (!q.trim()) return;
      APP_STATE.customerSearchQuery = q;
      navigateTo('customers');
    }

    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;
      const user = getCurrentUser();
      const navItems = ROLE_MODULES[user.role] || ROLE_MODULES.ADMIN;
      const isCompactMobileShell = APP_STATE.mobilePreviewMode;

      root.innerHTML = `
        <!-- Top Header Institucional Óptica Dens -->
        <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 px-3 sm:px-6 py-2.5 no-print">
          <div class="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-3">
            <!-- Marca con Logotipo Real Subido -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('dashboard')">
              <img src="${OPTICA_LOGO_SRC}" alt="Óptica Dens" class="h-10 sm:h-11 w-auto object-contain rounded-lg" />
              <div class="hidden sm:block border-l border-slate-200 pl-3">
                <div class="flex items-center gap-1.5">
                  <span class="font-extrabold text-sm text-densBlue-800 tracking-tight">ÓPTICA DENS</span>
                  <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-densLime-500 text-slate-950">MX • CFDI 4.0</span>
                </div>
                <p class="text-[11px] text-slate-500">Sistema Clínico, Laboratorio y POS (Reemplazo de Pulpos)</p>
              </div>
            </div>

            <!-- Buscador Global Instantáneo -->
            <div class="flex-1 max-w-md hidden md:block">
              <form onsubmit="event.preventDefault(); executeGlobalQuickSearch(this.q.value);" class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                <input
                  name="q"
                  value="${MX_FMT.escape(APP_STATE.globalSearchQuery)}"
                  placeholder="Búsqueda global: cliente, teléfono, RFC, código o receta..."
                  class="w-full pl-9 pr-3 py-1.5 rounded-xl bg-slate-100 focus:bg-white border border-transparent focus:border-densBlue-500 text-xs focus:outline-none"
                />
              </form>
            </div>

            <!-- Selector Interactivo de Rol + Simulador Vista Celular Recepción -->
            <div class="flex flex-wrap items-center gap-2">
              <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                <span class="text-[11px] font-bold text-slate-500 px-2 hidden xl:inline">Probar Rol:</span>
                ${DB.users.map(u => `
                  <button type="button"
                    onclick="switchUserRole('${u.id}')"
                    class="px-2.5 py-1 rounded-lg text-xs font-bold transition ${
                      u.id === user.id ? 'bg-densBlue-600 text-white shadow-xs' : 'text-slate-700 hover:bg-white'
                    }">
                    ${u.role === 'ADMIN' ? 'Admin' : (u.role === 'OPTOMETRIST' ? 'Optometrista' : 'Recepción')}
                  </button>
                `).join('')}
              </div>

              <button type="button"
                onclick="APP_STATE.mobilePreviewMode = !APP_STATE.mobilePreviewMode; renderApp();"
                class="px-2.5 py-1.5 rounded-xl border text-xs font-bold flex items-center gap-1 transition ${
                  APP_STATE.mobilePreviewMode ? 'bg-densLime-500 text-slate-950 border-densLime-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'
                }"
                title="Alternar vista compacta de celular para Recepción">
                <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">${APP_STATE.mobilePreviewMode ? 'Vista Celular Activa' : 'Vista Celular'}</span>
              </button>
            </div>
          </div>
        </header>

        <!-- Cuerpo Principal: Barra Lateral en Computadora + Contenido Adaptable -->
        <div class="flex-1 max-w-[1600px] w-full mx-auto flex ${isCompactMobileShell ? 'justify-center py-4 px-2 bg-slate-800/90' : ''}">
          ${isCompactMobileShell ? `
            <!-- Marco de Simulación de Celular para Recepción -->
            <div class="w-full max-w-[430px] bg-[#F4F7FA] rounded-[28px] border-4 border-slate-900 shadow-2xl overflow-hidden flex flex-col min-h-[780px]">
              <div class="bg-densBlue-800 text-white px-4 py-2 text-xs flex items-center justify-between">
                <span class="font-bold flex items-center gap-1.5"><i data-lucide="smartphone" class="w-3.5 h-3.5"></i> Modo Celular Recepción — Óptica Dens</span>
                <button type="button" onclick="APP_STATE.mobilePreviewMode=false; renderApp();" class="underline text-[11px]">Salir de vista móvil</button>
              </div>
              <main class="flex-1 p-3.5 overflow-y-auto pb-20">
                ${renderCurrentModuleContent()}
              </main>
              <nav class="bg-white border-t border-slate-200 px-2 py-1.5 grid grid-cols-5 gap-1">
                ${ROLE_MODULES.RECEPTION.slice(0, 5).map(m => `
                  <button type="button" onclick="navigateTo('${m.id}')" class="flex flex-col items-center py-1 rounded-xl ${APP_STATE.activeModule === m.id ? 'text-densBlue-600 font-bold' : 'text-slate-500'}">
                    <i data-lucide="${m.icon}" class="w-4 h-4"></i>
                    <span class="text-[10px] truncate max-w-full mt-0.5">${m.label.split(' ')[0]}</span>
                  </button>
                `).join('')}
              </nav>
            </div>
          ` : `
            <!-- Barra Lateral Completa en Computadora -->
            <aside class="hidden lg:flex flex-col w-64 shrink-0 bg-white border-r border-slate-200 p-3.5 justify-between no-print">
              <div class="space-y-1">
                <div class="px-2.5 py-2 mb-2 rounded-xl bg-slate-50 border border-slate-200/80 flex items-center gap-2.5">
                  <div class="w-8 h-8 rounded-xl text-white font-bold text-xs flex items-center justify-center shrink-0" style="background:${user.avatarBg}">
                    ${MX_FMT.escape(user.name.slice(0, 2).toUpperCase())}
                  </div>
                  <div class="min-w-0">
                    <p class="text-xs font-bold text-slate-900 truncate">${MX_FMT.escape(user.name)}</p>
                    <p class="text-[10px] font-semibold text-densBlue-700 truncate">${MX_FMT.escape(user.roleLabel)}</p>
                  </div>
                </div>

                ${navItems.map(item => {
                  const active = APP_STATE.activeModule === item.id;
                  const badgeVal = typeof item.badge === 'function' ? item.badge() : item.badge;
                  return `
                    <button type="button"
                      onclick="navigateTo('${item.id}')"
                      class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold transition ${
                        active
                          ? 'bg-densBlue-600 text-white shadow-xs'
                          : 'text-slate-700 hover:bg-slate-100'
                      }">
                      <span class="flex items-center gap-2.5 truncate">
                        <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0 ${active ? 'text-densLime-200' : 'text-densBlue-600'}"></i>
                        <span class="truncate">${item.label}</span>
                      </span>
                      ${badgeVal !== null && badgeVal !== undefined ? `
                        <span class="px-1.5 py-0.5 rounded-full text-[10px] font-bold ${
                          active ? 'bg-densLime-500 text-slate-950' : 'bg-slate-100 text-slate-700'
                        }">${badgeVal}</span>
                      ` : ''}
                    </button>
                  `;
                }).join('')}
              </div>

              <div class="pt-4 mt-4 border-t border-slate-200 text-[11px] text-slate-500 space-y-1 px-2">
                <div class="flex items-center gap-1.5 font-semibold text-slate-700">
                  ${renderEyeIcon(18)}
                  <span>Óptica Dens v2.5 PWA</span>
                </div>
                <p>Zona: America/Mexico_City</p>
                <p>Moneda: Peso Mexicano (MXN)</p>
              </div>
            </aside>

            <!-- Contenido Principal -->
            <main class="flex-1 p-3.5 sm:p-6 pb-24 lg:pb-10 min-w-0">
              ${renderCurrentModuleContent()}
            </main>
          `}
        </div>

        <!-- Barra Inferior Móvil Automática en Pantallas Pequeñas (< lg) -->
        <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-30 bg-white border-t border-slate-200 px-2 py-1.5 grid grid-cols-5 gap-1 shadow-lg no-print">
          ${navItems.slice(0, 5).map(m => `
            <button type="button"
              onclick="navigateTo('${m.id}')"
              class="flex flex-col items-center justify-center py-1 rounded-xl ${
                APP_STATE.activeModule === m.id ? 'text-densBlue-600 font-bold bg-densBlue-50/60' : 'text-slate-600'
              }">
              <i data-lucide="${m.icon}" class="w-4 h-4"></i>
              <span class="text-[10px] mt-0.5 truncate max-w-full">${m.label.split(' ')[0]}</span>
            </button>
          `).join('')}
        </nav>
      `;

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // Inicializar al cargar el DOM
    window.addEventListener('DOMContentLoaded', () => {
      setupPwaManifestAndServiceWorker();
      renderApp();
      renderPwaFloatingBanner();
    });
  </script>
</body>
</html>
